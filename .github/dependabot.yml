# Dependabot configuration for F19 Stealth Glider.
#
# Pruned to the ecosystems this repo actually has. The RSR template ships every
# common ecosystem with the instruction "remove unused ones for your project";
# nothing removed them, so `pip` failed on every scheduled run — there is no
# Python manifest here. `cargo`, `mix` and `nix` had no manifest either.
#
# Nix is retired estate-wide in favour of Guix, so a `nix` block is wrong in
# every repo, not just this one.

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Node.js/npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
