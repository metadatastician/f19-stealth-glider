# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The real gate for F19 Stealth Glider. Every step here can fail; none of them
# is annotate-only. If you add a step, make sure it can actually go red — a
# check that cannot fail is worse than no check, because it reads as coverage.
#
# ubuntu-latest ships Node 20 preinstalled and the project has zero
# dependencies, so there is no setup-node and no install step.
#
# Action pinning moved to a lockfile on 2026-08-04. GitHub now refuses to start
# a workflow that has no .github/workflows/actions.lock ("Workflow must use a
# lockfile"), so the immutable SHA lives in that file and the `uses:` line
# carries a narrowed semver tag. Do not "fix" those tags back to inline SHAs —
# regenerate with `gh actions-lock` instead. The lockfile is verified by a step
# below, offline.
#
# Code scanning is NOT here: it runs via GitHub code-scanning default setup
# (actions + javascript, extended suite, weekly). An advanced codeql.yml would
# conflict with default setup and fail permanently.

name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: verification ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # ubuntu-latest ships Node 20 preinstalled; no setup-node needed.
      - name: Node version
        run: node --version

      - name: Licence headers present on every source file
        run: |
          set -euo pipefail
          fail=0
          for f in src/*.mjs src/*.js scripts/*.mjs; do
            if [ "$(head -1 "$f")" != "// SPDX-License-Identifier: AGPL-3.0-or-later" ]; then
              echo "::error file=$f::missing SPDX AGPL header"; fail=1
            fi
          done
          [ "$fail" = 0 ]

      - name: Verification ledger (verify1,2,3,8,9 + build)
        working-directory: src
        run: |
          set -euo pipefail
          for v in verify1 verify2 verify3 verify8 verify9; do
            echo "== node $v.mjs =="
            node "$v.mjs"
          done
          echo "== node build.mjs =="
          node build.mjs

      - name: Bundle reproducibility — committed HTML matches a fresh rebuild
        run: |
          set -euo pipefail
          # build.mjs (run above, from src/) wrote src/f19-stealth-glider.html
          if ! diff -q src/f19-stealth-glider.html f19-stealth-glider.html; then
            echo "::error::committed f19-stealth-glider.html is stale — run 'just build' and commit"
            diff <(head -c 400 src/f19-stealth-glider.html) <(head -c 400 f19-stealth-glider.html) || true
            exit 1
          fi
          echo "bundle is reproducible and up to date"

  contracts:
    name: contractile probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # Every `- run:` probe in .machine_readable/contractiles/ is a shell
      # one-liner, so they are executed for real rather than read as prose.
      # Fails the build on any `critical` breach.
      - name: Execute the contractile probes
        run: node scripts/contractiles.mjs

      - name: SPDX identifier present on every .a2ml file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! head -3 "$f" | grep -q 'SPDX-License-Identifier:'; then
              echo "::error file=$f::missing SPDX identifier"; fail=1
            fi
          done < <(find . -name '*.a2ml' -not -path './.git/*')
          [ "$fail" = 0 ]

      # Guards against the failure mode this repo has hit twice: an action ref
      # the platform will not accept, which reports as startup_failure at 0s
      # rather than as a red check — a gate that never runs.
      #
      # The mechanism changed on 2026-08-04. GitHub now requires a workflow
      # lockfile (.github/workflows/actions.lock) and refuses to start a
      # workflow without one: "Workflow must use a lockfile." Under that model
      # the immutable SHA lives in the lockfile and the workflow carries a
      # narrowed semver tag, so the previous "every ref is 40 hex chars" grep
      # would now reject every correctly-locked ref.
      #
      # This check is the lockfile-aware equivalent, and is strictly stronger
      # than the grep it replaces: every ref must have a lockfile entry AND
      # that entry must resolve to a full 40-character SHA. The old grep
      # verified shape only; it could not tell a real commit from a plausible
      # one. Pure stdlib, no network, no gh extension — so it cannot fail open
      # because a tool was unavailable.
      - name: Every action ref is locked to a full commit SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib
          lock = pathlib.Path(".github/workflows/actions.lock")
          if not lock.is_file():
              sys.exit("::error::.github/workflows/actions.lock is missing — "
                       "GitHub refuses to start workflows without it. Run `gh actions-lock`.")
          text = lock.read_text()
          # commit: 'sha1-<40 hex>' — one entry per locked dependency.
          locked = {}
          for dep, sha in re.findall(
                  r"^\s{4}'([^']+)':\s*$(?:\n(?!\s{4}').*)*?\n\s+commit:\s*'sha1-([0-9a-f]{40})'",
                  text, re.M):
              locked[dep] = sha
          if not locked:
              sys.exit("::error::actions.lock contains no resolved dependencies")
          bad = 0
          for wf in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              for ref in re.findall(r"^\s*-?\s*uses:\s*([^\s#]+)", wf.read_text(), re.M):
                  if ref.startswith(("./", "$")):
                      continue  # same-repo action: inherently pinned to this commit
                  if ref not in locked:
                      print(f"::error file={wf}::{ref} has no actions.lock entry")
                      bad = 1
          if bad:
              sys.exit(1)
          print(f"all action refs locked to full SHAs ({len(locked)} dependencies)")
          PY

      # "All documentation filled in" is checkable: no RSR substitution token
      # may survive anywhere in the tree.
      - name: No unsubstituted template placeholders
        run: |
          set -euo pipefail
          # SHOUTY_SNAKE inside doubled braces. Deliberately narrower than a
          # bare "{{": GitHub Actions expressions double braces too.
          if grep -rlE '[{]{2}[A-Z][A-Z0-9_]*[}]{2}' --exclude-dir=.git . ; then
            echo "::error::the files above still contain template placeholders"
            exit 1
          fi
          echo "no template placeholders remain"
